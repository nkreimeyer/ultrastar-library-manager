stages: [test, build, release]

variables:
  GO_IMAGE: golang:1          # latest stable Go; pin (e.g. golang:1.27) if a runner needs it
  GOPATH: $CI_PROJECT_DIR/.go
  GOFLAGS: -modcacherw

default:
  image: $GO_IMAGE
  # Only runners with the Docker executor: a shell runner ignores image: and has no Go.
  tags: [docker]
  cache:
    key:
      files: [src/main/library-manager/go.sum]
    paths: [.go/pkg/mod/]
  before_script:
    - cd src/main/library-manager

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
    - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    - go vet ./...
    - go test -race ./...

# Only on a tag v*: other pipelines just run the checks.
build:
  stage: build
  needs: [test]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  parallel:
    matrix:
      - GOOS: [linux, windows, darwin]
  variables:
    GOARCH: amd64
    CGO_ENABLED: "0"
  script:
    - EXT=""; [ "$GOOS" = windows ] && EXT=".exe"
    - OUT="library-manager-${GOOS}-${GOARCH}${EXT}"
    - VERSION="$CI_COMMIT_TAG"
    - go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$CI_PROJECT_DIR/dist/$OUT" .
  artifacts:
    name: library-manager-$GOOS-$GOARCH
    paths: [dist/]
    expire_in: 30 days

# On a tag v*: a GitLab release whose assets link to the build job's artifacts. It goes through
# the Releases API, not the release: keyword, so a re-run (or a tag pushed again) updates the
# existing release instead of failing with "release for tag ... already exists".
release:
  stage: release
  image: alpine:3
  needs: [build]
  cache: []
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  # The release notes are the tag's section of CHANGELOG.md ("## [0.2.1] - date", without the heading).
  script:
    - apk add --no-cache curl jq > /dev/null
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      awk -v v="$VERSION" '
        /^## \[/ { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
        on && /^\[[^]]+\]: / { next }
        on { print }
      ' CHANGELOG.md | sed '/./,$!d' > release_notes.md
    - test -s release_notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
    - cat release_notes.md
    - |
      set -eu
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      tag=$(jq -rn --arg t "$CI_COMMIT_TAG" '$t|@uri')
      base="$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist"
      links=$(jq -n --arg b "$base" '[
        {name: "library-manager-linux-amd64", url: ($b + "/library-manager-linux-amd64?job=build:%20%5Blinux%5D")},
        {name: "library-manager-windows-amd64.exe", url: ($b + "/library-manager-windows-amd64.exe?job=build:%20%5Bwindows%5D")},
        {name: "library-manager-darwin-amd64", url: ($b + "/library-manager-darwin-amd64?job=build:%20%5Bdarwin%5D")}]')
      call() { curl -sS --fail-with-body -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" "$@"; }
      code=$(curl -sS -o existing.json -w '%{http_code}' -H "JOB-TOKEN: $CI_JOB_TOKEN" "$api/$tag")
      case "$code" in
      200)
        echo "Release $CI_COMMIT_TAG exists: updating its name and notes"
        jq -n --arg n "$CI_COMMIT_TAG" --rawfile d release_notes.md '{name: $n, description: $d}' |
          call -X PUT --data @- "$api/$tag" > /dev/null
        echo "$links" | jq -c --slurpfile e existing.json '.[] | select(.name as $n | [$e[0].assets.links[].name] | index($n) | not)' |
          while read -r link; do
            echo "Adding the missing asset link $(echo "$link" | jq -r .name)"
            echo "$link" | call -X POST --data @- "$api/$tag/assets/links" > /dev/null
          done
        ;;
      404)
        echo "Creating release $CI_COMMIT_TAG"
        jq -n --arg t "$CI_COMMIT_TAG" --rawfile d release_notes.md --argjson l "$links" \
          '{tag_name: $t, name: $t, description: $d, assets: {links: $l}}' |
          call -X POST --data @- "$api" > /dev/null
        ;;
      *)
        echo "Looking up release $CI_COMMIT_TAG failed (HTTP $code):"; cat existing.json; exit 1
        ;;
      esac
