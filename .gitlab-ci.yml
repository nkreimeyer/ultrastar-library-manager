stages: [test, build, release]

variables:
  GO_IMAGE: golang:1          # latest stable Go; pin (e.g. golang:1.27) if a runner needs it
  GOPATH: $CI_PROJECT_DIR/.go
  GOFLAGS: -modcacherw

default:
  image: $GO_IMAGE
  # Only runners with the Docker executor: a shell runner ignores image: and has no Go.
  tags: [docker]
  cache:
    key:
      files: [src/main/library-manager/go.sum]
    paths: [.go/pkg/mod/]
  before_script:
    - cd src/main/library-manager

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
    - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    - go vet ./...
    - go test -race ./...

# Only on a tag v*: other pipelines just run the checks.
build:
  stage: build
  needs: [test]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  parallel:
    matrix:
      - GOOS: [linux, windows, darwin]
  variables:
    GOARCH: amd64
    CGO_ENABLED: "0"
  script:
    - EXT=""; [ "$GOOS" = windows ] && EXT=".exe"
    - OUT="library-manager-${GOOS}-${GOARCH}${EXT}"
    - VERSION="$CI_COMMIT_TAG"
    - go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$CI_PROJECT_DIR/dist/$OUT" .
  artifacts:
    name: library-manager-$GOOS-$GOARCH
    paths: [dist/]
    expire_in: 30 days

# On a tag v*: a GitLab release whose assets link to the build job's artifacts.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build]
  cache: []
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  # The release notes are the tag's section of CHANGELOG.md ("## [0.2.1] - date", without the heading).
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      awk -v v="$VERSION" '
        /^## \[/ { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
        on && /^\[[^]]+\]: / { next }
        on { print }
      ' CHANGELOG.md | sed '/./,$!d' > release_notes.md
    - test -s release_notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release_notes.md
    assets:
      links:
        - name: library-manager-linux-amd64
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/library-manager-linux-amd64?job=build:%20%5Blinux%5D
        - name: library-manager-windows-amd64.exe
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/library-manager-windows-amd64.exe?job=build:%20%5Bwindows%5D
        - name: library-manager-darwin-amd64
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/library-manager-darwin-amd64?job=build:%20%5Bdarwin%5D
