# SonarQube analysis of the Go module (and its embedded web UI). old/ is legacy code, kept
# for reference only, and is not analysed.
#
#   (cd src/main/library-manager && go test -coverprofile=coverage.out ./...)
#   docker run --rm -e SONAR_TOKEN -e SONAR_HOST_URL -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
sonar.projectKey=karaoke-scripts
sonar.projectName=karaoke-scripts
sonar.sourceEncoding=UTF-8

sonar.sources=src/main/library-manager
sonar.tests=src/main/library-manager
sonar.exclusions=**/*_test.go,**/testdata/**,**/internal/testutil/**,**/coverage.out
sonar.test.inclusions=**/*_test.go,**/testdata/**
sonar.go.coverage.reportPaths=src/main/library-manager/coverage.out

# Rules left out on purpose:
# - cognitive complexity in tests: table tests and their checks are long by nature;
# - nested ternaries and nested template literals in the UI's h(...) element trees, the
#   style the whole page is written in.
sonar.issue.ignore.multicriteria=testcc,ternary,template
sonar.issue.ignore.multicriteria.testcc.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.testcc.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.ternary.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.ternary.resourceKey=**/webui/static/*.js
sonar.issue.ignore.multicriteria.template.ruleKey=javascript:S4624
sonar.issue.ignore.multicriteria.template.resourceKey=**/webui/static/*.js
