name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: src/main/library-manager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: src/main/library-manager/go.sum
      - name: Install ffmpeg (for the ffmpeg tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   ext: '' }
          - { goos: windows, ext: '.exe' }
          - { goos: darwin,  ext: '' }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64
      CGO_ENABLED: '0'
      OUT: library-manager-${{ matrix.goos }}-amd64${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: src/main/library-manager/go.sum
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::8}"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$OUT" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: src/main/library-manager/${{ env.OUT }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum library-manager-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes library-manager-* SHA256SUMS
