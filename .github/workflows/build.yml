name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: src/main/library-manager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: src/main/library-manager/go.sum
      - name: Install ffmpeg (for the ffmpeg tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # Only on a tag v*: other runs just check.
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   ext: '' }
          - { goos: windows, ext: '.exe' }
          - { goos: darwin,  ext: '' }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64
      CGO_ENABLED: '0'
      OUT: library-manager-${{ matrix.goos }}-amd64${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: src/main/library-manager/go.sum
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$OUT" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: src/main/library-manager/${{ env.OUT }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release notes are the tag's section of CHANGELOG.md ("## [0.2.1] - date", without
      # the heading), as on GitLab.
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' > release_notes.md
          test -s release_notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          cat release_notes.md
      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum library-manager-* > SHA256SUMS
          # A re-run (or a tag pushed again) replaces the notes and assets of the existing release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file ../release_notes.md
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber library-manager-* SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file ../release_notes.md library-manager-* SHA256SUMS
          fi
