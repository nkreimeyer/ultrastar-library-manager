<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>library-manager</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-bars" aria-hidden="true"><i></i><i></i><i></i></span>library-manager</div>
    <div class="switch" role="group" aria-label="Interface mode">
      <button type="button" data-mode="easy" aria-pressed="true">Easy</button>
      <button type="button" data-mode="advanced" aria-pressed="false">Advanced</button>
    </div>
    <div class="tools" id="tools" aria-live="polite"><span class="dot"></span>Checking ffmpeg…</div>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
  <details class="log" id="log" hidden>
    <summary>Log <span class="muted small" id="log-count"></span></summary>
    <div class="log-tools">
      <label>Show
        <select id="log-level">
          <option value="debug">everything</option>
          <option value="info" selected>info and above</option>
          <option value="warning">warnings and errors</option>
          <option value="error">errors only</option>
        </select>
      </label>
      <label class="row"><input type="checkbox" id="log-follow" checked> Follow new lines</label>
    </div>
    <pre id="log-lines"></pre>
  </details>
  <dialog id="picker"></dialog>
  <dialog id="confirm"></dialog>
  <noscript>This page needs JavaScript.</noscript>
</body>
</html>
